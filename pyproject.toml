[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is named for the repository; the package it installs is
# "euclid", which is also the command. Same split as scikit-learn / sklearn.
name = "executable-euclid"
version = "0.1.0"
description = "Euclid's Elements as executable, exactly-verified software"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["euclid", "geometry", "constructible-numbers", "exact-arithmetic", "formal-methods"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
euclid = "euclid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
